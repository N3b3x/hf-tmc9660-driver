# Jekyll configuration for TMC9660 driver documentation
title: "HardFOC TMC9660 Driver"
description: >
  Comprehensive TMC9660 motor driver for HardFOC systems with BLDC, stepper, and DC motor control,
  supporting parameter mode (TMCL) and register mode interfaces

baseurl: "/hf-tmc9660-driver"  # GitHub Pages subpath
url: "https://n3b3x.github.io"

# Author and social information
author:
  name: "N3b3x"
  email: "n3b3x@example.com"
  url: "https://github.com/n3b3x"

# Directory configuration
layouts_dir: _config/_layouts
includes_dir: _config/_includes

# Theme and plugins
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-redirect-from
  - jekyll-optional-front-matter

# Navigation settings
nav_next_prev: true

# Markdown and syntax highlighting
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Site settings
timezone: UTC
encoding: utf-8
lang: en

# Just the Docs configuration
search_enabled: true
search:
  heading_level: 3
  previews: 5
  preview_words_before: 10
  preview_words_after: 15
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: true

# Navigation and UI enhancements
nav_enabled: true
heading_anchors: true
breadcrumbs: true
toc:
  min_level: 2
  max_level: 4

# Callouts for better content presentation
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: red

# Visual enhancements
color_scheme: dark
toggle_color_scheme: true
toggle_auto_mode: true

# Auxiliary links with better organization
aux_links:
  "📚 GitHub Repository":
    - "https://github.com/n3b3x/hf-tmc9660-driver"
  "🐛 Report Issues":
    - "https://github.com/n3b3x/hf-tmc9660-driver/issues"
  "⭐ Star on GitHub":
    - "https://github.com/n3b3x/hf-tmc9660-driver/stargazers"

# Footer customization
footer_content: >
  Built with ❤️ using <a href='https://just-the-docs.github.io/just-the-docs/'>Just the Docs</a> •
  <a href='https://github.com/n3b3x/hf-tmc9660-driver/blob/main/LICENSE'>GPL v3 License</a> •
  <a href='https://github.com/n3b3x/hf-tmc9660-driver'>View on GitHub</a>

# Collections for better organization
collections:
  docs:
    permalink: "/:collection/:path/"
    output: true
    sort_by: nav_order

# Just the Docs configuration
just_the_docs:
  # Navigation configuration
  nav_fold: true
  nav_external_links:
    - title: "📚 GitHub Repository"
      url: "https://github.com/n3b3x/hf-tmc9660-driver"
    - title: "🐛 Issues"
      url: "https://github.com/n3b3x/hf-tmc9660-driver/issues"

  # Custom head content
  head_custom: _includes/head_custom.html

  # Custom CSS and JS
  custom_css:
    - assets/css/custom.css
  custom_js:
    - assets/js/custom.js

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .github
  - "*.gem"
  - "*.gemspec"
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - examples/esp32/scripts/
  - _config/doxygen-extensions/
  - inc/
  - src/
  - CMakeLists.txt
  - Doxyfile

# Include files that are normally excluded
include:
  - _pages
  - ../README.md
  - ../LICENSE
  - assets/

# Enhanced SEO settings
seo:
  type: "SoftwareApplication"
  name: "HardFOC TMC9660 Driver"
  description: >
    Comprehensive TMC9660 motor driver for HardFOC systems with BLDC, stepper, and DC motor control,
    supporting parameter mode (TMCL) and register mode interfaces
  url: "https://n3b3x.github.io/hf-tmc9660-driver"
  twitter:
    card: "summary_large_image"
    site: "@n3b3x"
  og:
    type: "website"
    locale: "en_US"

# Social media and sharing
social:
  name: "HardFOC TMC9660 Driver"
  links:
    - "https://github.com/n3b3x/hf-tmc9660-driver"
    - "https://github.com/n3b3x"

# Performance optimizations
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: [html, head, body]

# TMC9660 Driver specific settings
tmc9660:
  version: "1.0.0-dev"
  branch: "main"
  version_type: "development"
  motor_types:
    - "BLDC"
    - "Stepper"
    - "DC"
  communication_modes:
    - "Parameter Mode (TMCL)"
    - "Register Mode (SPI)"
  interfaces:
    - "UART"
    - "SPI"
  features:
    - "FOC (Field-Oriented Control)"
    - "Microstepping"
    - "Bootloader Support"
    - "Telemetry & Diagnostics"

