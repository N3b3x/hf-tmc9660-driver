###############################################################################
#  TMC9660 Driver – ESP-IDF Component Manager Manifest
#
#  This manifest file describes the TMC9660 driver component for the ESP-IDF
#  Component Manager. The TMC9660 is a hardware-agnostic motor driver IC that
#  supports BLDC, stepper, and DC motor control with advanced features like
#  FOC (Field-Oriented Control), sensorless operation, and comprehensive
#  telemetry.
#
#  For more information about the ESP-IDF Component Manager manifest format,
#  see: https://docs.espressif.com/projects/idf-component-manager/en/latest/reference/manifest_file.html
###############################################################################

# ─── Component Metadata ───────────────────────────────────────────────────────
name: hf-tmc9660-driver
version: "1.0.0"
description: |
  TMC9660 Hardware-Agnostic Motor Driver - comprehensive driver library for the
  TMC9660 motor control IC supporting BLDC, stepper, and DC motors. Features
  FOC (Field-Oriented Control), sensorless operation, comprehensive telemetry,
  bootloader support, and both parameter mode and register mode interfaces.
  Designed for embedded systems with full ESP32 family support and modern
  ESP-IDF v5.0+ integration.

# ─── External Links ───────────────────────────────────────────────────────────
url: "https://www.analog.com/en/products/tmc9660.html"
repository: "https://github.com/N3b3x/hf-tmc9660-driver.git"
documentation: "https://github.com/N3b3x/hf-tmc9660-driver/blob/main/README.md"
issues: "https://github.com/N3b3x/hf-tmc9660-driver/issues"

# ─── Licensing and Maintenance ───────────────────────────────────────────────
license: "MIT"
maintainers:
  - "Nebiyu Tadesse <nebysma@gmail.com>"

# ─── Component Classification ────────────────────────────────────────────────
tags:
  - "tmc9660"          # TMC9660 motor driver
  - "motor-control"    # Motor control systems
  - "bldc"             # Brushless DC motors
  - "stepper"          # Stepper motor control
  - "foc"              # Field-Oriented Control
  - "sensorless"       # Sensorless operation
  - "driver"           # Device drivers
  - "esp-idf"          # ESP-IDF framework
  - "esp32"            # ESP32 family
  - "hardware-agnostic" # Platform independent
  - "telemetry"        # Motor telemetry
  - "bootloader"       # Bootloader support
  - "parameter-mode"   # Parameter mode interface
  - "register-mode"    # Register mode interface
  - "spi"              # SPI communication
  - "uart"             # UART communication
  - "i2c"              # I2C communication

# ─── Supported Targets ───────────────────────────────────────────────────────
targets:
  - esp32              # ESP32 classic
  - esp32c6            # ESP32-C6
  - esp32s2            # ESP32-S2
  - esp32s3            # ESP32-S3
  - esp32c3            # ESP32-C3
  - esp32c2            # ESP32-C2
  - esp32h2            # ESP32-H2

# ─── Dependencies ────────────────────────────────────────────────────────────
dependencies:
  # ESP-IDF Framework (required for all ESP32 development)
  idf: ">=5.0.0"

  # ESP-IDF Core Components (built-in, no external dependencies needed)
  # These are automatically available when using ESP-IDF

# ─── Packaging Configuration ─────────────────────────────────────────────────
files:
  # Include all source files and headers
  include:
    - "inc/**/*"
    - "src/**/*"
    - "CMakeLists.txt"
    - "idf_component.yml"
    - "LICENSE"
    - "README.md"

  # Exclude development and documentation files to minimize package size
  exclude:
    # Documentation and examples (kept separate)
    - "**/docs/**"
    - "**/examples/**"
    - "**/tests/**"

    # Development and CI files
    - "**/.github/**"
    - "**/.gitlab-ci.yml"
    - "**/.git/**"
    - "**/.svn/**"

    # IDE and editor files
    - "**/.idea/**"
    - "**/.vscode/**"
    - "**/.settings/**"
    - "**/.DS_Store"
    - "**/Thumbs.db"

    # Build artifacts
    - "**/build/**"
    - "**/dist/**"
    - "**/managed_components/**"
    - "**/dependencies.lock"
    - "**/sdkconfig"
    - "**/sdkconfig.old"
    - "**/.component_hash"

    # Python and cache files
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/*.pyd"
    - "**/*.pyo"

###############################################################################
#  Component Architecture Overview
#
#  The TMC9660 Driver consists of several layers:
#
#  1. Core Driver Classes (inc/)
#     - TMC9660: Main driver class with hardware-agnostic interface
#     - TMC9660Bootloader: Bootloader functionality for firmware updates
#     - TMC9660CommInterface: Communication interface abstraction
#
#  2. Parameter Mode Interface (inc/parameter_mode/)
#     - tmc9660_param_mode_tmcl.hpp: TMCL protocol implementation
#     - High-level motor control commands and parameters
#
#  3. Register Mode Interface (inc/register_mode/)
#     - tmc9660_adc.hpp: ADC configuration and control
#     - tmc9660_mcc.hpp: Motor Control Core registers
#     - tmc9660_ramDebug.hpp: RAM debug functionality
#     - tmc9660_sys_ctrl.hpp: System control registers
#     - Low-level register access and configuration
#
#  4. Implementation Files (src/)
#     - TMC9660.cpp: Core driver implementation
#     - bootloader/TMC9660Bootloader.cpp: Bootloader implementation
#
#  Usage Example:
#  ```cpp
#  #include "TMC9660.hpp"
#  #include "parameter_mode/tmc9660_param_mode_tmcl.hpp"
#
#  // Create driver instance
#  TMC9660 driver;
#
#  // Initialize with SPI communication
#  if (driver.Initialize(spi_interface, cs_pin)) {
#      // Set motor parameters
#      driver.SetMotorType(MotorType::BLDC);
#      driver.SetMotorParameters(12, 0.1f, 1000);
#
#      // Start motor control
#      driver.EnableMotor();
#      driver.SetVelocity(1000);  // 1000 RPM
#  }
#  ```
###############################################################################
